# OBSERVABILIDAD mínima en el clúster: OTel Collector + Jaeger.
# Para métricas se recomienda kube-prometheus-stack (Prometheus + Grafana) con Helm;
# los servicios exponen /metrics y Traefik expone sus métricas en el puerto 9100 del chart.
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector, namespace: sentineluni }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
          grpc: { endpoint: 0.0.0.0:4317 }
    processors:
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls: { insecure: true }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [batch], exporters: [otlp/jaeger] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: sentineluni }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/conf/config.yaml"]
          ports: [{ containerPort: 4318 }, { containerPort: 4317 }]
          volumeMounts: [{ name: conf, mountPath: /conf }]
      volumes: [{ name: conf, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: sentineluni }
spec:
  selector: { app: otel-collector }
  ports: [{ name: http, port: 4318 }, { name: grpc, port: 4317 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: sentineluni }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports: [{ containerPort: 16686 }, { containerPort: 4317 }]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: sentineluni }
spec:
  selector: { app: jaeger }
  ports: [{ name: ui, port: 16686 }, { name: otlp, port: 4317 }]
---
# NetworkPolicy: los servicios internos solo aceptan tráfico desde Traefik o desde el propio namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: solo-gateway-y-namespace, namespace: sentineluni }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
