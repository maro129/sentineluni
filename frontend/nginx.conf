server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Archivos con hash en el nombre: caché larga (la regex va entre comillas porque lleva llaves {8})
  location ~* "\.[0-9a-f]{8}\.js$" { add_header Cache-Control "public, max-age=31536000, immutable"; }
  # Puntos de entrada que deben estar siempre frescos (nuevas versiones de cada MFE / PWA)
  location ~* (remoteEntry\.js|sw\.js|index\.html|manifest\.webmanifest)$ { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
