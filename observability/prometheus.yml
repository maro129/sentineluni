global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api-gateway
    static_configs: [{ targets: ["traefik:8082"] }]
  - job_name: user-service
    static_configs: [{ targets: ["user-service:3000"] }]
  - job_name: go-services
    static_configs:
      - targets: ["incident-service:8080", "triage-service:8080", "notification-service:8080", "audit-service:8080"]
