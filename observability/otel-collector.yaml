# OpenTelemetry Collector: recibe trazas (OTLP) de Traefik, User Service y los servicios Go
# y las envía a Jaeger. Un solo punto de salida: cambiar de backend de trazas no toca el código.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  batch: {}
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
