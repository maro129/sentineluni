# CI/CD de SentinelUNI: pruebas, análisis de seguridad y build de imágenes en cada push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-services:
    name: Backend Go (Incident + Consumers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go mod tidy && git diff --exit-code go.mod || echo "go.mod actualizado por tidy"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Vulnerabilidades conocidas (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  user-service:
    name: User Service (NestJS)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/user-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/user-service/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (shell + microfrontends)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  mobile:
    name: App móvil (React Native)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  platform:
    name: Docker Compose y Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - name: Validar manifiestos de Kubernetes
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/0*.yaml k8s/1*.yaml k8s/2*.yaml k8s/3*.yaml k8s/4*.yaml k8s/5*.yaml

  images:
    name: Imágenes Docker → GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-services, user-service, frontend, platform]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: incident-service, context: ., file: go.Dockerfile, arg: "SERVICE=services/incident-service" }
          - { name: triage-service, context: ., file: go.Dockerfile, arg: "SERVICE=consumers/triage-service" }
          - { name: notification-service, context: ., file: go.Dockerfile, arg: "SERVICE=consumers/notification-service" }
          - { name: audit-service, context: ., file: go.Dockerfile, arg: "SERVICE=consumers/audit-service" }
          - { name: user-service, context: services/user-service, file: services/user-service/Dockerfile, arg: "" }
          - { name: shell, context: frontend, file: frontend/Dockerfile, arg: "APP=shell" }
          - { name: mfe-incidents, context: frontend, file: frontend/Dockerfile, arg: "APP=mfe-incidents" }
          - { name: mfe-notifications, context: frontend, file: frontend/Dockerfile, arg: "APP=mfe-notifications" }
          - { name: mfe-audit, context: frontend, file: frontend/Dockerfile, arg: "APP=mfe-audit" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.arg }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sentineluni-${{ matrix.name }}:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/sentineluni-${{ matrix.name }}:latest
