# Excepciones del WAF (OWASP CRS) para SentinelUNI — se cargan ANTES de las reglas de CRS.
#
# Ajustar un WAF consiste en eliminar falsos positivos de forma PUNTUAL: se quita una regla
# solo para un parámetro y una ruta concretos, y el resto de la protección queda intacto.

# ── Keycloak (OpenID Connect) ─────────────────────────────────────────────────────────────
# El login envía redirect_uri=https://localhost/ (adónde volver después de iniciar sesión).
# CRS lo marca como posible SSRF (regla 934190: "localhost" dentro de un parámetro) y como
# posible inclusión remota de archivos (RFI) porque el valor es una URL. Es legítimo:
# Keycloak solo acepta las redirect_uri registradas en el cliente sentinel-web.
# Solo se excluyen ESOS parámetros, y solo en las rutas del realm sentineluni.
SecRule REQUEST_FILENAME "@beginsWith /auth/realms/sentineluni/" \
    "id:10010,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:post_logout_redirect_uri,\
    ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:post_logout_redirect_uri"
