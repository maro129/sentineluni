# PostgreSQL de SentinelUNI — quién puede conectarse y cómo.
# TLS OBLIGATORIO por la red: cualquier conexión sin cifrar se rechaza.
# TYPE      DATABASE  USER  ADDRESS    METHOD
local       all       all              trust          # dentro del contenedor (scripts de inicio y healthcheck)
hostnossl   all       all   all        reject         # sin TLS → rechazada
hostssl     all       all   all        scram-sha-256  # con TLS + contraseña (SCRAM)
