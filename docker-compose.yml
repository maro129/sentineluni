# SentinelUNI — arquitectura completa del curso con Docker Compose.
#   Frontend (shell + 3 MFE, PWA) → API Gateway (Traefik) → Backend (NestJS, Go)
#   → Event Bus (NATS JetStream) → Event Consumers (Go) → Datos (PostgreSQL, Redis, MongoDB, MinIO)
#   + Observabilidad (OpenTelemetry Collector, Jaeger, Prometheus, Grafana)
#
# Uso:  cp .env.example .env   &&   docker compose up -d --build   →   https://localhost
# Solo el API Gateway publica puertos hacia afuera (80/443). Los paneles de observabilidad
# se publican únicamente en 127.0.0.1.

name: sentineluni

x-go-service: &go-service
  restart: unless-stopped
  networks: [backend]
  environment: &go-env
    NATS_URL: nats://nats:4222
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  depends_on: &go-deps
    nats: { condition: service_healthy }

services:
  # ───────────────────────── API GATEWAY ─────────────────────────
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8080"   # dashboard de Traefik
    volumes:
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/dynamic:/etc/traefik/dynamic:ro
      - ./gateway/certs:/etc/traefik/certs:ro
    networks: [edge, backend]
    depends_on: [user-service]

  # ───────────────────────── FRONTEND (Module Federation + PWA) ─────────────────────────
  shell:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { APP: shell } }
    restart: unless-stopped
    networks: [edge]
  mfe-incidents:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { APP: mfe-incidents } }
    restart: unless-stopped
    networks: [edge]
  mfe-notifications:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { APP: mfe-notifications } }
    restart: unless-stopped
    networks: [edge]
  mfe-audit:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { APP: mfe-audit } }
    restart: unless-stopped
    networks: [edge]

  # ───────────────────────── BACKEND ─────────────────────────
  user-service:
    build: ./services/user-service
    restart: unless-stopped
    networks: [backend]
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://users_svc:${USERS_DB_PASSWORD}@postgres:5432/users_db
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: user-service
    depends_on:
      postgres: { condition: service_healthy }

  incident-service:
    <<: *go-service
    build: { context: ., dockerfile: go.Dockerfile, args: { SERVICE: services/incident-service } }
    environment:
      <<: *go-env
      DATABASE_URL: postgres://incidents_svc:${INCIDENTS_DB_PASSWORD}@postgres:5432/incidents_db
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: evidence
    depends_on:
      <<: *go-deps
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  # ───────────────────────── EVENT CONSUMERS ─────────────────────────
  triage-service:
    <<: *go-service
    build: { context: ., dockerfile: go.Dockerfile, args: { SERVICE: consumers/triage-service } }

  notification-service:
    <<: *go-service
    build: { context: ., dockerfile: go.Dockerfile, args: { SERVICE: consumers/notification-service } }
    environment:
      <<: *go-env
      DATABASE_URL: postgres://notifications_svc:${NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    networks: [backend, egress]   # salida a internet solo para Telegram
    depends_on:
      <<: *go-deps
      postgres: { condition: service_healthy }

  audit-service:
    <<: *go-service
    build: { context: ., dockerfile: go.Dockerfile, args: { SERVICE: consumers/audit-service } }
    environment:
      <<: *go-env
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: audit_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      <<: *go-deps
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ───────────────────────── EVENT BUS ─────────────────────────
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats-data:/data]
    networks: [backend, ops]
    ports: ["127.0.0.1:8222:8222"]   # monitoreo de NATS
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      retries: 20

  # ───────────────────────── DATOS ─────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
      INCIDENTS_DB_PASSWORD: ${INCIDENTS_DB_PASSWORD}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 30

  minio:
    # MinIO (Object Storage, API S3). La imagen oficial minio/minio fue retirada de Docker Hub;
    # se usa la compilación de Chainguard del mismo MinIO. Corre como root para poder escribir
    # en el volumen (la imagen trae el usuario 65532 por defecto).
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    networks: [backend, ops]
    ports: ["127.0.0.1:9001:9001"]   # consola de MinIO (Object Storage)
    # Sin healthcheck: la imagen no trae mc, curl ni wget. Incident Service reintenta
    # la conexión con MinIO hasta que esté listo.

  # ───────────────────────── OBSERVABILIDAD ─────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    networks: [backend]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    networks: [backend, ops]
    ports: ["127.0.0.1:16686:16686"]   # UI de trazas

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks: [backend, ops]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [backend, ops]
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

networks:
  edge: {}                       # gateway ↔ frontends
  backend: { internal: true }    # servicios y datos: sin salida a internet ni puertos públicos
  egress: {}                     # salida a internet (solo notification-service)
  ops: {}                        # paneles de operación publicados solo en 127.0.0.1

volumes:
  pg-data: {}
  redis-data: {}
  mongo-data: {}
  minio-data: {}
  nats-data: {}
  prom-data: {}
  grafana-data: {}
