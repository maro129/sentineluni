# API GATEWAY (Traefik v3) — configuración estática.
# Puerta de entrada a los microservicios: routing, autenticación JWT (Keycloak), rate limiting,
# cabeceras de seguridad, logging (access log JSON), métricas Prometheus y trazas OpenTelemetry.
#
# Desde la entrega de seguridad, Traefik YA NO recibe tráfico directo de internet:
#   navegador ──TLS──▶ WAF (ModSecurity + OWASP CRS) ──TLS──▶ Traefik :443 ──▶ servicios
# Traefik no publica los puertos 80/443 al exterior; solo el WAF puede llegar a él.
entryPoints:
  websecure:
    address: ":443"
    http:
      tls: {}                    # certificado interno "traefik" (gateway/dynamic/tls.yml), firmado por la CA interna
    forwardedHeaders:
      # El único cliente de Traefik es el WAF, que añade X-Forwarded-For con la IP real del usuario.
      # Se confía en esa cabecera para que el rate limiting cuente por usuario y no por WAF.
      insecure: true
  metrics:
    address: ":8082"             # solo red interna: lo lee Prometheus

providers:
  file:
    directory: /etc/traefik/dynamic   # routes.yml + tls.yml (certificado interno)
    watch: true

api:
  dashboard: true
  insecure: true                 # dashboard en :8080 (publicado solo en localhost para la demo)

ping: {}

log:
  level: INFO

accessLog:
  format: json
  fields:
    headers:
      names:
        X-User: keep             # quién hizo la petición (lo pone el forwardAuth)
        X-Forwarded-For: keep    # IP real del usuario (la añade el WAF)
        Authorization: drop      # nunca registrar el token

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true

tracing:
  serviceName: api-gateway
  otlp:
    http:
      endpoint: http://otel-collector:4318/v1/traces
